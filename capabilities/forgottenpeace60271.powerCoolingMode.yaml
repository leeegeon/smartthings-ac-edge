id: forgottenpeace60271.powerCoolingMode
version: 1
status: proposed
name: power cooling mode
attributes:
  powerCoolingMode:
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - normal
            - power
          default: normal
      additionalProperties: false
      required:
        - value
    enumCommands: []
commands:
  setPowerCoolingMode:
    name: setPowerCoolingMode
    arguments:
      - name: powerCoolingMode
        optional: false
        schema:
          type: string
          enum:
            - normal
            - power
